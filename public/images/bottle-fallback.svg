<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8dcc8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4c4a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b494;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a6b55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C4A3B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3F0E7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F3F0E7;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Bottle body -->
  <path d="M 150 120 
           C 140 140, 130 180, 125 250
           C 120 350, 118 450, 120 550
           C 122 620, 125 660, 135 700
           C 140 720, 155 735, 200 738
           C 245 735, 260 720, 265 700
           C 275 660, 278 620, 280 550
           C 282 450, 280 350, 275 250
           C 270 180, 260 140, 250 120
           Z" 
        fill="url(#bodyGrad)" filter="url(#shadow)"/>
  
  <!-- Paper texture lines -->
  <path d="M 145 200 C 165 198, 235 198, 255 200" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M 140 280 C 160 278, 240 278, 260 280" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M 135 360 C 155 358, 245 358, 265 360" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M 133 440 C 153 438, 247 438, 267 440" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M 135 520 C 155 518, 245 518, 265 520" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M 138 600 C 158 598, 242 598, 262 600" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
  
  <!-- Label area -->
  <rect x="145" y="320" width="110" height="200" rx="8" fill="url(#labelGrad)"/>
  
  <!-- Neck -->
  <path d="M 165 120 C 165 100, 170 80, 175 70 
           L 225 70 
           C 230 80, 235 100, 235 120 Z" 
        fill="url(#bodyGrad)"/>
  
  <!-- Cap -->
  <rect x="168" y="30" width="64" height="44" rx="6" fill="url(#capGrad)"/>
  <rect x="173" y="24" width="54" height="10" rx="4" fill="#1C4A3B"/>
  
  <!-- Cap ring detail -->
  <rect x="170" y="68" width="60" height="6" rx="3" fill="#1C4A3B" opacity="0.7"/>
  
  <!-- Subtle highlight -->
  <ellipse cx="180" cy="400" rx="20" ry="180" fill="#F3F0E7" opacity="0.08"/>
</svg>
