<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" width="400" height="900">
  <defs>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8dcc8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGradE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a6b55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C4A3B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="linerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b494;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#b8a888;stop-opacity:0.85" />
    </linearGradient>
    <filter id="shadowE" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cap (separated at top) -->
  <g transform="translate(0, 0)" filter="url(#shadowE)">
    <rect x="170" y="40" width="60" height="40" rx="5" fill="url(#capGradE)"/>
    <rect x="175" y="34" width="50" height="10" rx="4" fill="#1C4A3B"/>
    <rect x="172" y="75" width="56" height="5" rx="2.5" fill="#1C4A3B" opacity="0.7"/>
    <!-- Label -->
    <text x="320" y="60" fill="#F3F0E7" opacity="0.7" font-family="sans-serif" font-size="11" letter-spacing="1">CAP</text>
    <line x1="240" y1="60" x2="310" y2="60" stroke="#C8A96B" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Body (outer shell, separated) -->
  <g transform="translate(0, 60)" filter="url(#shadowE)">
    <path d="M 155 160 C 150 180, 148 250, 150 350 C 152 420, 155 440, 165 460 C 175 475, 195 480, 200 480 C 205 480, 225 475, 235 460 C 245 440, 248 420, 250 350 C 252 250, 250 180, 245 160 Z" 
          fill="url(#kraftGrad)"/>
    <!-- Paper texture -->
    <path d="M 160 220 C 175 218, 225 218, 240 220" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
    <path d="M 158 300 C 173 298, 227 298, 242 300" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
    <path d="M 158 380 C 173 378, 227 378, 242 380" stroke="#c4b090" stroke-width="0.5" fill="none" opacity="0.3"/>
    <!-- Label area -->
    <rect x="165" y="270" width="70" height="100" rx="4" fill="#F3F0E7" opacity="0.2"/>
    <!-- Label -->
    <text x="320" y="320" fill="#F3F0E7" opacity="0.7" font-family="sans-serif" font-size="11" letter-spacing="1">BODY</text>
    <line x1="260" y1="320" x2="310" y2="320" stroke="#C8A96B" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Liner (inner layer, separated) -->
  <g transform="translate(0, 140)" filter="url(#shadowE)">
    <path d="M 165 160 C 162 180, 160 240, 162 330 C 163 390, 165 410, 172 425 C 180 435, 195 438, 200 438 C 205 438, 220 435, 228 425 C 235 410, 237 390, 238 330 C 240 240, 238 180, 235 160 Z" 
          fill="url(#linerGrad)" opacity="0.85"/>
    <!-- Label -->
    <text x="320" y="300" fill="#F3F0E7" opacity="0.7" font-family="sans-serif" font-size="11" letter-spacing="1">LINER</text>
    <line x1="245" y1="300" x2="310" y2="300" stroke="#C8A96B" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Base (bottom disc, separated) -->
  <g transform="translate(0, 220)" filter="url(#shadowE)">
    <ellipse cx="200" cy="660" rx="50" ry="12" fill="#a89878"/>
    <rect x="155" y="648" width="90" height="12" rx="4" fill="#d4c4a8"/>
    <ellipse cx="200" cy="648" rx="40" ry="8" fill="#c4b494"/>
    <!-- Label -->
    <text x="320" y="655" fill="#F3F0E7" opacity="0.7" font-family="sans-serif" font-size="11" letter-spacing="1">BASE</text>
    <line x1="258" y1="655" x2="310" y2="655" stroke="#C8A96B" stroke-width="0.5" opacity="0.5"/>
  </g>
</svg>
